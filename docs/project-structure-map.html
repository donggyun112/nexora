<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexora 구조 시각화</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --ink: #172033;
        --muted: #5f6b7a;
        --line: #d7dfeb;
        --paper: #ffffff;
        --blue: #2563eb;
        --teal: #0f766e;
        --green: #16a34a;
        --amber: #d97706;
        --rose: #e11d48;
        --purple: #7c3aed;
        --slate: #334155;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.55;
      }

      .wrap {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .header-inner {
        display: grid;
        grid-template-columns: auto minmax(420px, 1fr);
        gap: 18px;
        align-items: center;
        padding: 12px 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 0;
      }

      nav a {
        color: var(--ink);
        text-decoration: none;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f8fbff;
        font-size: 12px;
        font-weight: 800;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 8px;
        padding-top: 0;
        border-top: 0;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 7px;
        border-radius: 999px;
        background: transparent;
        border: 0;
        color: #344054;
        font-size: 11px;
        font-weight: 800;
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--tone);
      }

      main {
        padding: 18px 0 64px;
      }

      section {
        margin-top: 26px;
      }

      .section-head {
        margin-bottom: 12px;
      }

      h2 {
        margin: 0;
        font-size: 25px;
        letter-spacing: 0;
      }

      .diagram {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 16px 34px rgba(15, 23, 42, 0.07);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .diagram-pad {
        padding: 14px;
      }

      .svg-title {
        font-size: 20px;
        font-weight: 950;
        fill: var(--ink);
      }

      .box-title {
        font-size: 16px;
        font-weight: 950;
        fill: var(--ink);
        text-anchor: middle;
      }

      .box-sub {
        font-size: 13px;
        font-weight: 760;
        fill: var(--muted);
        text-anchor: middle;
      }

      .lane-label {
        text-anchor: start;
      }

      .group-title {
        font-size: 15px;
        font-weight: 950;
        fill: #fff;
        text-anchor: middle;
      }

      .white {
        fill: #fff;
      }

      .box {
        fill: #fff;
        stroke: var(--line);
        stroke-width: 1.5;
      }

      .dash {
        stroke-dasharray: 7 6;
      }

      @media (max-width: 900px) {
        .header-inner {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        nav,
        .legend {
          justify-content: flex-start;
        }

      }

      @media (max-width: 560px) {
        .wrap {
          width: min(100% - 24px, 1180px);
        }
      }
    </style>
  </head>
